services:
  - type: web
    name: it-monthly-dashboard-service
    env: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 5000

  - type: cron
    name: license-expiry-lark-reminder
    env: node
    schedule: "0 2 * * *"
    buildCommand: npm install --omit=dev
    startCommand: node server/triggerLicenseExpiryReminder.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
